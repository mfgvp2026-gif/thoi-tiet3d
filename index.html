<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Dự báo Thời tiết 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Three.js cho Đồ họa 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 min-h-screen text-white font-sans overflow-x-hidden relative">

    <!-- Lớp nền Đồ họa 3D toàn màn hình -->
    <div id="canvas3d" class="absolute top-0 left-0 w-full h-full z-0 pointer-events-auto"></div>

    <!-- Giao diện điều khiển ứng dụng (Nổi lên trên lớp 3D) -->
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4 pointer-events-none">
        <div class="bg-slate-900/70 backdrop-blur-xl p-6 rounded-3xl shadow-2xl w-full max-w-lg border border-white/10 my-4 pointer-events-auto">
            
            <!-- Ô tìm kiếm và nút GPS -->
            <div class="flex gap-2 mb-6">
                <input type="text" id="cityInput" placeholder="Nhập tên thành phố (vd: Hanoi)..." 
                    class="flex-1 px-4 py-2 bg-white/10 border border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-white/40 text-white placeholder-white/50">
                <button id="searchBtn" class="bg-white text-slate-900 font-bold px-4 py-2 rounded-xl hover:bg-opacity-90 transition-all cursor-pointer">
                    🔍
                </button>
                <button id="gpsBtn" title="Vị trí hiện tại" class="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl hover:bg-blue-700 transition-all cursor-pointer">
                    📍
                </button>
            </div>

            <!-- Khối hiển thị thời tiết hiện tại -->
            <div id="weatherDisplay" class="text-center my-4 hidden">
                <h1 id="cityName" class="text-3xl font-bold tracking-wide">Thành phố</h1>
                <p id="weatherTime" class="text-sm text-white/50 mt-1">Cập nhật lúc --:--</p>
                
                <div class="my-4">
                    <span id="temperature" class="text-6xl font-extrabold relative">0<span class="text-2xl absolute top-1 -right-5">°C</span></span>
                </div>
                
                <p id="weatherCondition" class="text-xl font-medium capitalize text-sky-400">Đang tải...</p>
                
                <!-- Chỉ số phụ -->
                <div class="grid grid-cols-2 gap-4 mt-6 bg-white/5 p-4 rounded-2xl border border-white/5">
                    <div class="text-left p-2">
                        <span class="block text-white/40 text-xs uppercase">Tốc độ gió</span>
                        <span id="windSpeed" class="text-lg font-semibold">0 km/h</span>
                    </div>
                    <div class="text-left p-2">
                        <span class="block text-white/40 text-xs uppercase">Độ ẩm</span>
                        <span id="humidity" class="text-lg font-semibold">0%</span>
                    </div>
                </div>
            </div>

            <!-- Khối biểu đồ 24h -->
            <div id="chartContainer" class="mt-6 bg-white/5 p-4 rounded-2xl border border-white/5 hidden">
                <canvas id="tempChart" class="w-full"></canvas>
            </div>

            <!-- Khối dự báo 7 ngày -->
            <div id="forecastContainer" class="mt-6 bg-white/5 p-4 rounded-2xl border border-white/5 hidden">
                <h2 class="text-sm font-semibold mb-3 text-white/60">Dự báo 7 ngày tới</h2>
                <div id="forecastList" class="space-y-3 divide-y divide-white/5"></div>
            </div>

            <!-- Trạng thái thông báo -->
            <div id="statusMessage" class="text-center py-8 text-white/60">
                <p class="animate-pulse">Đang yêu cầu định vị hệ thống...</p>
            </div>

        </div>
    </div>

    <script>
        const weatherMap = {
            0: ["Trời quang mây tạnh", "sunny"],
            1: ["Ít mây", "cloudy"], 2: ["Mây rải rác", "cloudy"], 3: ["Nhiều mây", "cloudy"],
            45: ["Có sương mù", "cloudy"], 48: ["Sương mù đóng băng", "cloudy"],
            51: ["Mưa phùn nhỏ", "rainy"], 53: ["Mưa phùn vừa", "rainy"], 55: ["Mưa phùn dày đặc", "rainy"],
            61: ["Mưa nhỏ nhẹ", "rainy"], 63: ["Mưa vừa", "rainy"], 65: ["Mưa to nặng hạt", "rainy"],
            71: ["Tuyết rơi nhỏ", "snowy"], 73: ["Tuyết rơi vừa", "snowy"], 75: ["Tuyết rơi dày", "snowy"],
            80: ["Mưa rào nhẹ", "rainy"], 81: ["Mưa rào vừa", "rainy"], 82: ["Mưa rào rất to", "rainy"],
            95: ["Mưa giông bão", "stormy"], 96: ["Mưa đá kèm giông", "stormy"], 99: ["Mưa đá lớn bão", "stormy"]
        };

        const weatherIcons = { "sunny": "☀️", "cloudy": "☁️", "rainy": "🌧️", "snowy": "❄️", "stormy": "🌩️" };

        let tempChart = null;
        let scene, camera, renderer, weatherParticles, environmentMesh;
        let currentType = "sunny";

        function init3D() {
            const container = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 40;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const geometry = new THREE.SphereGeometry(12, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: 0x00d2ff, wireframe: true, transparent: true, opacity: 0.15 });
            environmentMesh = new THREE.Mesh(geometry, material);
            scene.add(environmentMesh);

            createParticles("sunny");

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            animate();
        }

        function createParticles(type) {
            if (weatherParticles) scene.remove(weatherParticles);

            const particleCount = type === "sunny" ? 200 : type === "cloudy" ? 400 : 1500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            
            for(let i=0; i<particleCount*3; i+=3) {
                positions[i] = (Math.random() - 0.5) * 100;
                positions[i+1] = (Math.random() - 0.5) * 100;
                positions[i+2] = (Math.random() - 0.5) * 100;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            let color = 0xffaa00;
            if (type === "cloudy") color = 0x8899a6;
            if (type === "rainy" || type === "stormy") color = 0x4fa6ff;
            if (type === "snowy") color = 0xffffff;

            const material = new THREE.PointsMaterial({ size: type === "sunny" ? 0.6 : 0.3, color: color, transparent: true, opacity: 0.7 });
            weatherParticles = new THREE.Points(geometry, material);
            scene.add(weatherParticles);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (environmentMesh) {
                environmentMesh.rotation.y += 0.002;
                environmentMesh.rotation.x += 0.001;
            }

            if (weatherParticles) {
                const positions = weatherParticles.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    if (currentType === "rainy" || currentType === "stormy") {
                        positions[i] -= 0.8;
                    } else if (currentType === "snowy") {
                        positions[i] -= 0.15;
                    } else {
                        positions[i] -= 0.02;
                    }

                    if (positions[i] < -50) positions[i] = 50;
                }
                weatherParticles.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('DOMContentLoaded', () => {
            init3D();
            getGPSLocation();
        });

        document.getElementById('searchBtn').addEventListener('click', searchCity);
        document.getElementById('cityInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchCity(); });
        document.getElementById('gpsBtn').addEventListener('click', getGPSLocation);

        function getGPSLocation() {
            showStatus("Đang định vị tọa độ GPS...");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchWeatherData(pos.coords.latitude, pos.coords.longitude, "Vị trí của bạn"),
                    () => fetchWeatherData(21.0285, 105.8542, "Hà Nội")
                );
            } else {
                fetchWeatherData(21.0285, 105.8542, "Hà Nội");
            }
        }

        async function searchCity() {
            const cityName = document.getElementById('cityInput').value.trim();
            if (!cityName) return;
            showStatus(`Đang tìm kiếm "${cityName}"...`);
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1`);
                const data = await res.json();
                if (!data.results) { showStatus("❌ Không tìm thấy địa danh."); return; }
                const city = data.results;
                fetchWeatherData(city.latitude, city.longitude, city.name);
            } catch { showStatus("❌ Lỗi mạng kết nối."); }
        }

        async function fetchWeatherData(lat, lon, label) {
            showStatus("Đang nạp dữ liệu khí tượng...");
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`);
                const data = await res.json();
                renderWeather(data, label);
            } catch { showStatus("❌ Không thể tải dữ liệu thời tiết."); }
        }

        function renderWeather(data, label) {
            document.getElementById('statusMessage').classList.add('hidden');
            document.getElementById('weatherDisplay').classList.remove('hidden');
            document.getElementById('chartContainer').classList.remove('hidden');
            document.getElementById('forecastContainer').classList.remove('hidden');

            const current = data.current;
            const config = weatherMap[current.weather_code] || ["Không xác định", "sunny"];
            
            currentType = config[1];
            createParticles(currentType);
            if(currentType === "sunny") environmentMesh.material.color.setHex(0xffaa00);
            if(currentType === "cloudy") environmentMesh.material.color.setHex(0x556677);
            if(currentType === "rainy" || currentType === "stormy") environmentMesh.material.color.setHex(0x0055ff);
            if(currentType === "snowy") environmentMesh.material.color.setHex(0xffffff);

            document.getElementById('cityName').textContent = label;
            document.getElementById('weatherTime').textContent = `Cập nhật: ${current.time.replace('T', ' ')}`;
            document.getElementById('temperature').innerHTML = `${Math.round(current.temperature_2m)}<span class="text-2xl absolute top-1 -right-5">°C</span>`;
            document.getElementById('weatherCondition').textContent = config[0];
            document.getElementById('windSpeed').textContent = `${current.wind_speed_10m} km/h`;
            document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;

            renderChart(data.hourly);
            render7DayForecast(data.daily);
        }

        function renderChart(hourlyData) {
            const labels = hourlyData.time.slice(0, 24).map(t => t.split('T')[1]);
            const temps = hourlyData.temperature_2m.slice(0, 24);
            if (tempChart) tempChart.destroy();
            const ctx = document.getElementById('tempChart').getContext('2d');
            tempChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ data: temps, borderColor: '#fff', borderWidth: 2, fill: false, tension: 0.4, pointRadius: 0 }]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#ffffff80', maxTicksLimit: 6 }, grid: { display: false } }, y: { ticks: { color: '#ffffff80' }, grid: { color: '#ffffff10' } } } }
            });
        }

        function render7DayForecast(dailyData) {
            const list = document.getElementById('forecastList');
            list.innerHTML = '';
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

            for (let i = 0; i < dailyData.time.length; i++) {
                const date = new Date(dailyData.time[i]);
                let dayLabel = i === 0 ? "Hôm nay" : days[date.getDay()];
                const cfg = weatherMap[dailyData.weather_code[i]] || ["Không xác định", "sunny"];
                const icon = weatherIcons[cfg[1]] || "☀️";

                const row = document.createElement('div');
                row.className = "flex items-center justify-between py-2 text-sm";
                row.innerHTML = `
                    <div class="w-1/3 text-left"><p>${dayLabel}</p><p class="text-xs text-white/40">${dailyData.time[i].split('-').reverse().slice(0,2).join('/')}</p></div>
                    <div class="w-1/3 text-center text-xl">${icon}</div>
                    <div class="w-1/3 text-right"><span>${Math.round(dailyData.temperature_2m_max[i])}°</span><span class="text-white/30 ml-2">${Math.round(dailyData.temperature_2m_min[i])}°</span></div>
                `;
                list.appendChild(row);
            }
        }

        function showStatus(msg) {
            document.getElementById('statusMessage').classList.remove('hidden');
            document.getElementById('statusMessage').innerHTML = `<p class="animate-pulse">${msg}</p>`;
            document.getElementById('weatherDisplay').classList.add('hidden');
            document.getElementById('chartContainer').classList.add('hidden');
            document.getElementById('forecastContainer').classList.add('hidden');
        }
    </script>
</body>
</html>
